---

driver:
  name: docker
platforms:
  - name: instance-almalinux9
    image: "dokken/almalinux-9"
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: "/lib/systemd/systemd" # Для dokken-образов это обязательно
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
verifier:
  name: ansible
