---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check curl works
      ansible.builtin.command:
        cmd: curl --version
      register: curl_version
      changed_when: false
      failed_when: curl_version.rc != 0

    - name: Assert curl installed
      ansible.builtin.assert:
        that:
          - curl_version.rc == 0
        success_msg: "curl is installed and works"